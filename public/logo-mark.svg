<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
    <filter id="glow15" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5"/>
    </filter>
    <filter id="glow6" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
    <filter id="glow10" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10"/>
    </filter>
    <radialGradient id="atmo" cx="50%" cy="50%" r="50%">
      <stop offset="72%" stop-color="#06B6D4" stop-opacity="0"/>
      <stop offset="88%" stop-color="#06B6D4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="globeBody" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="30%" stop-color="#1E3A8A"/>
      <stop offset="65%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <radialGradient id="lit" cx="0.35" cy="0.32" r="0.55">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0A0F1F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="r1g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="22%" stop-color="#EC4899"/>
      <stop offset="48%" stop-color="#F97316"/>
      <stop offset="72%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="r2g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="flare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <clipPath id="globeClip">
      <circle cx="64" cy="64" r="40"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <circle cx="64" cy="64" r="64" fill="#0A0F1F"/>

  <!-- Deep ambient glow -->
  <circle cx="64" cy="64" r="60" fill="#2563EB" opacity="0.08" filter="url(#glow10)"/>

  <!-- Atmosphere halo -->
  <circle cx="64" cy="64" r="48" fill="url(#atmo)"/>
  <circle cx="64" cy="64" r="48" fill="#06B6D4" opacity="0.12" filter="url(#glow6)"/>

  <!-- Globe body -->
  <circle cx="64" cy="64" r="40" fill="url(#globeBody)"/>

  <!-- Continental landmasses (glowing teal outlines) -->
  <g clip-path="url(#globeClip)" opacity="0.45">
    <!-- North America -->
    <path d="M38 30c2-2 5-3 8-2s5 3 7 5c3 2 5 6 5 9 0 3-1 5-3 7-2 2-4 4-6 5-3 2-6 2-8 1-2-1-4-3-5-5-1-3-1-6 1-8 1-2 3-3 5-4 2-1 3-3 3-4" fill="#14B8A6" stroke="#2DD4BF" stroke-width="0.5" stroke-opacity="0.6"/>
    <!-- South America -->
    <path d="M50 72c2-1 4 0 6 2 2 2 3 5 3 8 0 3-1 6-3 8-2 2-4 4-6 4-2 0-4-1-5-3-1-2-2-5-1-7 1-2 2-3 4-4 1-1 2-2 3-2" fill="#14B8A6" stroke="#2DD4BF" stroke-width="0.5" stroke-opacity="0.6"/>
    <!-- Europe/Africa -->
    <path d="M67 32c1-1 3-2 5-1s3 3 4 5c1 3 1 5 0 7-1 2-3 4-5 5-2 1-4 1-5 0-2-1-3-3-3-5 0-2 1-4 3-5 1-1 1-2 1-3" fill="#14B8A6" stroke="#2DD4BF" stroke-width="0.5" stroke-opacity="0.6"/>
    <path d="M68 54c1-1 3-1 5 0 2 2 3 4 3 7 0 3-1 5-3 7-2 2-4 3-6 2-2-1-3-3-3-6 0-2 1-5 2-6 1-1 1-3 2-4" fill="#14B8A6" stroke="#2DD4BF" stroke-width="0.5" stroke-opacity="0.6"/>
    <!-- Asia -->
    <path d="M76 28c2-1 5 0 7 2 2 3 3 6 2 9-1 3-3 5-6 6-2 1-5 1-7-1-2-2-3-5-2-7 1-2 3-4 5-5 1-1 2-3 3-4" fill="#14B8A6" stroke="#2DD4BF" stroke-width="0.5" stroke-opacity="0.6"/>
    <!-- Australia -->
    <path d="M84 66c1-1 3-1 5 0 2 1 3 3 3 5 0 2-1 4-3 5-2 1-4 1-5 0-2-1-3-3-2-5 0-1 1-3 2-5" fill="#14B8A6" stroke="#2DD4BF" stroke-width="0.5" stroke-opacity="0.6"/>
  </g>

  <!-- Continental dot texture (particle scattering) -->
  <g clip-path="url(#globeClip)" opacity="0.5">
    <circle cx="42" cy="34" r="0.8" fill="#5EEAD4"/>
    <circle cx="45" cy="37" r="0.6" fill="#5EEAD4"/>
    <circle cx="48" cy="33" r="0.7" fill="#2DD4BF"/>
    <circle cx="44" cy="40" r="0.5" fill="#5EEAD4"/>
    <circle cx="50" cy="36" r="0.6" fill="#2DD4BF"/>
    <circle cx="41" cy="37" r="0.5" fill="#5EEAD4"/>
    <circle cx="46" cy="31" r="0.7" fill="#2DD4BF"/>
    <circle cx="49" cy="39" r="0.5" fill="#5EEAD4"/>
    <circle cx="52" cy="74" r="0.6" fill="#5EEAD4"/>
    <circle cx="50" cy="77" r="0.7" fill="#2DD4BF"/>
    <circle cx="48" cy="80" r="0.5" fill="#5EEAD4"/>
    <circle cx="53" cy="76" r="0.5" fill="#2DD4BF"/>
    <circle cx="69" cy="36" r="0.6" fill="#5EEAD4"/>
    <circle cx="71" cy="39" r="0.5" fill="#2DD4BF"/>
    <circle cx="73" cy="42" r="0.7" fill="#5EEAD4"/>
    <circle cx="70" cy="58" r="0.6" fill="#5EEAD4"/>
    <circle cx="72" cy="61" r="0.5" fill="#2DD4BF"/>
    <circle cx="69" cy="63" r="0.7" fill="#5EEAD4"/>
    <circle cx="78" cy="32" r="0.6" fill="#5EEAD4"/>
    <circle cx="80" cy="35" r="0.5" fill="#2DD4BF"/>
    <circle cx="82" cy="38" r="0.7" fill="#5EEAD4"/>
    <circle cx="86" cy="68" r="0.5" fill="#5EEAD4"/>
    <circle cx="88" cy="71" r="0.6" fill="#2DD4BF"/>
    <circle cx="85" cy="73" r="0.5" fill="#5EEAD4"/>
    <circle cx="55" cy="30" r="0.4" fill="#99F6E4"/>
    <circle cx="60" cy="32" r="0.4" fill="#99F6E4"/>
    <circle cx="75" cy="30" r="0.4" fill="#99F6E4"/>
    <circle cx="47" cy="35" r="0.4" fill="#99F6E4"/>
    <circle cx="51" cy="75" r="0.4" fill="#99F6E4"/>
    <circle cx="70" cy="59" r="0.4" fill="#99F6E4"/>
    <circle cx="79" cy="34" r="0.4" fill="#99F6E4"/>
    <circle cx="87" cy="69" r="0.4" fill="#99F6E4"/>
  </g>

  <!-- Globe specular highlight -->
  <circle cx="64" cy="64" r="40" fill="url(#lit)"/>

  <!-- Globe rim light -->
  <circle cx="64" cy="64" r="40" fill="none" stroke="#3B82F6" stroke-width="0.8" opacity="0.5"/>

  <!-- Orbital ring 1 glow (pink/orange) -->
  <ellipse cx="64" cy="64" rx="56" ry="18" fill="none" stroke="#EC4899" stroke-width="4" opacity="0.2" transform="rotate(-25 64 64)" filter="url(#glow6)"/>
  <!-- Orbital ring 1 -->
  <ellipse cx="64" cy="64" rx="56" ry="18" fill="none" stroke="url(#r1g)" stroke-width="2" opacity="0.9" transform="rotate(-25 64 64)"/>

  <!-- Orbital ring 2 glow (cyan/blue) -->
  <ellipse cx="64" cy="64" rx="52" ry="14" fill="none" stroke="#06B6D4" stroke-width="3" opacity="0.2" transform="rotate(35 64 64)" filter="url(#glow6)"/>
  <!-- Orbital ring 2 -->
  <ellipse cx="64" cy="64" rx="52" ry="14" fill="none" stroke="url(#r2g)" stroke-width="1.6" opacity="0.85" transform="rotate(35 64 64)"/>

  <!-- Starburst bloom (top orbit-globe intersection) -->
  <circle cx="79" cy="30" r="12" fill="#F97316" opacity="0.12" filter="url(#glow10)"/>
  <circle cx="79" cy="30" r="7" fill="#F59E0B" opacity="0.18" filter="url(#glow6)"/>
  <!-- Starburst core -->
  <circle cx="79" cy="30" r="3" fill="url(#flare)"/>
  <!-- Starburst rays -->
  <line x1="79" y1="22" x2="79" y2="38" stroke="white" stroke-width="1.4" opacity="0.7"/>
  <line x1="71" y1="30" x2="87" y2="30" stroke="white" stroke-width="1.4" opacity="0.7"/>
  <line x1="73.5" y1="24.5" x2="84.5" y2="35.5" stroke="white" stroke-width="0.8" opacity="0.5"/>
  <line x1="84.5" y1="24.5" x2="73.5" y2="35.5" stroke="white" stroke-width="0.8" opacity="0.5"/>
  <line x1="76" y1="23" x2="82" y2="37" stroke="white" stroke-width="0.5" opacity="0.35"/>
  <line x1="82" y1="23" x2="76" y2="37" stroke="white" stroke-width="0.5" opacity="0.35"/>
  <!-- Starburst warm glow -->
  <circle cx="79" cy="30" r="5" fill="#F97316" opacity="0.15" filter="url(#glow15)"/>
</svg>
