<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0A0F1F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="globe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="45%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="highlight" cx="35%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="ring2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="flare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Dark background circle -->
  <circle cx="64" cy="64" r="64" fill="#0A0F1F"/>

  <!-- Ambient glow -->
  <circle cx="64" cy="60" r="52" fill="url(#glow)"/>

  <!-- Globe body -->
  <circle cx="64" cy="64" r="40" fill="url(#globe)"/>

  <!-- Continental hint -->
  <path d="M52 42c4-1 8 2 12 6s4 10 2 16-6 12-14 14-14-2-16-8 0-14 6-20 8-8 10-8z" fill="#14B8A6" fill-opacity="0.35"/>
  <path d="M72 56c2-4 8-6 12-2s4 12 0 18-12 8-16 4-2-12 4-20z" fill="#14B8A6" fill-opacity="0.25"/>

  <!-- Globe highlight -->
  <circle cx="64" cy="64" r="40" fill="url(#highlight)"/>

  <!-- Globe rim -->
  <circle cx="64" cy="64" r="40" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Orbital ring 1 (pink/orange) - ellipse via transform -->
  <ellipse cx="64" cy="64" rx="56" ry="18" fill="none" stroke="url(#ring1)" stroke-width="2.2" stroke-opacity="0.9" transform="rotate(-25 64 64)"/>

  <!-- Orbital ring 2 (cyan/blue) - ellipse via transform -->
  <ellipse cx="64" cy="64" rx="52" ry="14" fill="none" stroke="url(#ring2)" stroke-width="1.8" stroke-opacity="0.8" transform="rotate(35 64 64)"/>

  <!-- Lens flare glow -->
  <circle cx="82" cy="40" r="8" fill="white" fill-opacity="0.15"/>

  <!-- Lens flare core -->
  <circle cx="82" cy="40" r="3" fill="url(#flare)"/>

  <!-- Lens flare rays -->
  <line x1="82" y1="34" x2="82" y2="46" stroke="white" stroke-width="1.2" stroke-opacity="0.7"/>
  <line x1="76" y1="40" x2="88" y2="40" stroke="white" stroke-width="1.2" stroke-opacity="0.7"/>
  <line x1="78" y1="36" x2="86" y2="44" stroke="white" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="86" y1="36" x2="78" y2="44" stroke="white" stroke-width="0.8" stroke-opacity="0.5"/>
</svg>
